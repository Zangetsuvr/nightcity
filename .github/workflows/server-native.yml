name: Check native server

# Builds the native game server (Server.Native, what deploy/update.sh builds on
# the VPS) on Linux, so changes to it or to the network protocol are checked
# before they reach the VPS. The log goes to the "server-native-ci" branch.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['code/server/native/**', 'code/protocol/**', 'code/common/**', 'code/netpack/**', '.github/workflows/server-native.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Build tools
        run: sudo apt-get update -q && sudo apt-get install -yq g++ make cmake ninja-build pkg-config perl python3 autoconf automake libtool libicu-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore xmake packages
        uses: actions/cache/restore@v4
        with:
          path: ~/.xmake/packages
          key: linux-xmake-pkgs-${{ hashFiles('**/xmake.lua') }}-${{ github.run_id }}
          restore-keys: |
            linux-xmake-pkgs-${{ hashFiles('**/xmake.lua') }}-
            linux-xmake-pkgs-

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.2

      - name: Build
        run: |
          set +e
          : > build.log
          xmake f -y -m release >> build.log 2>&1
          xmake -y -v Server.Native >> build.log 2>&1
          status=$?
          echo "status=$status" >> build.log
          grep -E "error|Error|=== |status=" build.log | head -300 > summary.txt
          exit 0

      - name: Save xmake packages
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.xmake/packages
          key: linux-xmake-pkgs-${{ hashFiles('**/xmake.lua') }}-${{ github.run_id }}

      - name: Publish log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && cp build.log summary.txt out/ 2>/dev/null; echo "${GITHUB_SHA}" > out/COMMIT.txt
          tail -c 200000 build.log > out/build-tail.log 2>/dev/null
          cd out
          git init -q -b server-native-ci
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -q -m "server native ci ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:refs/heads/server-native-ci
