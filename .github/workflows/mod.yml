name: Build game mod

# Builds the multiplayer mod (CyberpunkMP.dll + scripts and assets) on Windows
# and uploads it as the "CyberpunkMP-mod" artifact, laid out like the game
# folder (red4ext/plugins/CyberpunkMP/...), ready to drop into the modpack.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule sync --recursive
          git submodule update --init --force --recursive --depth=1

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/.xmake/packages
          key: ${{ runner.os }}-xmake-packages-${{ hashFiles('**/xmake.lua') }}
          restore-keys: |
            ${{ runner.os }}-xmake-packages-

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 2.9.6
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ runner.os }}-xmake-cache-2.9.6

      - name: Configure
        run: xmake config --arch=x64 --mode=release --vs_sdkver=10.0.19041.0 --yes

      - name: Build the mod
        run: xmake build -y -v Client

      - name: Package
        run: powershell -ExecutionPolicy Bypass -File deploy\package-client.ps1

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CyberpunkMP-mod
          path: modpack/
